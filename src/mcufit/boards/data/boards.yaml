    chip: RP2040 (Cortex-M0+ dual-core @ 133 MHz)
    sram: 270336        # 264 KB
    flash: 2097152      # 2 MB
    reserved_sram: 65536   # CYW43 wireless driver + lwIP
    notes: "Same silicon as the Pico; the Wi-Fi stack eats ~32 KB extra RAM."

  - id: teensy40
    vendor: Teensy
    cpu_mhz: 600
    macs_per_cycle: 0.4
