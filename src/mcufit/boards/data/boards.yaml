    chip: ESP32-P4 (RISC-V dual-core @ 400 MHz)
    sram: 786432        # 768 KB HP SRAM
    flash: 16777216     # 16 MB (module-dependent)
    reserved_sram: 65536   # no radio stack on-chip
    psram: 8388608      # PSRAM size varies by module
    notes: "Espressif's compute flagship: no radio, AI instruction extensions."

  - id: esp8266
