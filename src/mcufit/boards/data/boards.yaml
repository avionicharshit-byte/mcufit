# mcufit board database.
#
# Contributions welcome! Add your board with a PR - sizes in bytes.
# reserved_sram: RAM typically taken by the RTOS / radio stack / bootloader
# before your application allocates anything, so verdicts reflect reality.

boards:
  - id: esp32
    vendor: Espressif
    cpu_mhz: 240
    macs_per_cycle: 0.2
    name: ESP32 DevKit
    chip: ESP32 (Xtensa LX6 dual-core @ 240 MHz)
    sram: 532480        # 520 KB
    flash: 4194304      # 4 MB typical module
    reserved_sram: 204800  # ~200 KB for IDF + Wi-Fi/BT stacks
    notes: "Classic ESP32. Reserve grows if Wi-Fi and Bluetooth run together."

  - id: esp32-s3
    vendor: Espressif
    cpu_mhz: 240
    macs_per_cycle: 0.5
    name: ESP32-S3 DevKit
    chip: ESP32-S3 (Xtensa LX7 dual-core @ 240 MHz, vector instructions)
    sram: 524288        # 512 KB
    flash: 8388608      # 8 MB typical module
    reserved_sram: 153600  # ~150 KB for IDF + radio
    psram: 8388608      # 8 MB octal PSRAM on common modules
    notes: "Best ESP32 for ML: vector ISA + optional 8 MB PSRAM for big arenas."

  - id: esp32-c3
    vendor: Espressif
    cpu_mhz: 160
    macs_per_cycle: 0.1
    name: ESP32-C3 DevKit
    chip: ESP32-C3 (RISC-V single-core @ 160 MHz)
    sram: 409600        # 400 KB
    flash: 4194304      # 4 MB
    reserved_sram: 153600
    notes: "Budget RISC-V part; fine for small int8 models."

  - id: rp2040
    vendor: Raspberry Pi
    cpu_mhz: 133
    macs_per_cycle: 0.05
    name: Raspberry Pi Pico
    chip: RP2040 (Cortex-M0+ dual-core @ 133 MHz)
    sram: 270336        # 264 KB
    flash: 2097152      # 2 MB
    reserved_sram: 32768
    notes: "No FPU - float32 models run painfully slowly; quantize to int8."

  - id: rp2350
    vendor: Raspberry Pi
    cpu_mhz: 150
    macs_per_cycle: 0.15
    name: Raspberry Pi Pico 2
    chip: RP2350 (Cortex-M33 dual-core @ 150 MHz)
    sram: 532480        # 520 KB
    flash: 4194304      # 4 MB
    reserved_sram: 32768
    notes: "FPU + DSP extensions; solid TinyML target."

  - id: stm32f411
    vendor: STM32
    cpu_mhz: 100
    macs_per_cycle: 0.15
    name: STM32F411 "BlackPill"
    chip: STM32F411CE (Cortex-M4F @ 100 MHz)
    sram: 131072        # 128 KB
    flash: 524288       # 512 KB
    reserved_sram: 16384
    notes: "Popular hobby board; tight RAM, good for keyword-spotting size models."

  - id: stm32f746
    vendor: STM32
    cpu_mhz: 216
    macs_per_cycle: 0.4
    name: STM32F746 Discovery
    chip: STM32F746NG (Cortex-M7 @ 216 MHz)
    sram: 327680        # 320 KB
    flash: 1048576      # 1 MB
    reserved_sram: 32768
    notes: "Common TinyML benchmark board (MLPerf Tiny)."

  - id: stm32h743
    vendor: STM32
    cpu_mhz: 480
    macs_per_cycle: 0.4
    name: STM32H743 Nucleo
    chip: STM32H743ZI (Cortex-M7 @ 480 MHz)
    sram: 1048576       # 1 MB total (512 KB AXI + banks)
    flash: 2097152      # 2 MB
    reserved_sram: 65536
    notes: "One of the roomiest Cortex-M targets for on-device ML."

  - id: nano33ble
    vendor: Arduino
    cpu_mhz: 64
    macs_per_cycle: 0.15
    name: Arduino Nano 33 BLE Sense
    chip: nRF52840 (Cortex-M4F @ 64 MHz)
    sram: 262144        # 256 KB
    flash: 1048576      # 1 MB
    reserved_sram: 49152  # SoftDevice BLE stack
    notes: "The original TinyML course board; onboard mic + IMU."

  - id: teensy41
    vendor: Teensy
    cpu_mhz: 600
    macs_per_cycle: 0.4
    name: Teensy 4.1
    chip: i.MX RT1062 (Cortex-M7 @ 600 MHz)
    sram: 1048576       # 1 MB (512 KB TCM + 512 KB OCRAM)
    flash: 8126464      # 7.75 MB program flash
    reserved_sram: 65536
    notes: "Fastest common MCU board; great for audio ML."

  - id: xiao-esp32s3
