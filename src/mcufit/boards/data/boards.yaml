    chip: ATmega328P (AVR @ 16 MHz)
    sram: 2048          # 2 KB
    flash: 32768        # 32 KB
    reserved_sram: 512
    notes: "Spoiler: your model does not fit. Included so the tool can prove it."

  - id: esp32-s2
    vendor: Espressif
    cpu_mhz: 240
    macs_per_cycle: 0.2
    name: ESP32-S2 DevKit
