[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcufit"
version = "0.5.2"
description = "Check if an AI model fits on a microcontroller - before you flash it."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "avionicharshit-byte", email = "avionicharshit@gmail.com" }]
requires-python = ">=3.10"
keywords = ["tinyml", "tflite", "microcontroller", "esp32", "embedded", "edge-ai", "memory"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "typer>=0.9",
    "rich>=13.0",
    "PyYAML>=6.0",
    "tflite>=2.10",
    "numpy>=1.24",
]

[project.urls]
Homepage = "https://github.com/avionicharshit-byte/mcufit"
Issues = "https://github.com/avionicharshit-byte/mcufit/issues"

[project.scripts]
mcufit = "mcufit.cli:main"

[project.optional-dependencies]
onnx = ["onnx>=1.15"]
dev = ["pytest>=7.0", "onnx>=1.15"]

[tool.hatch.build.targets.wheel]
packages = ["src/mcufit"]
