name: "mcufit check"
description: "Fail CI when an AI model no longer fits its target microcontroller"
branding:
  icon: "cpu"
  color: "green"

inputs:
  model:
    description: "Path to the .tflite model in the repository"
    required: true
  board:
    description: "Target board id (see `mcufit boards`)"
    required: true
  exact:
    description: >-
      Require the real TFLM measurement and fail if it is unavailable, instead of
      falling back to the static estimate. The measurement is already the default
      here, because this action installs node for it, so you only need this if you
      would rather the job failed than silently used the estimate.
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    # mcufit measures the arena by running TFLM compiled to wasm32 under node.
    # Without node it falls back to a deliberately conservative static estimate,
    # which would make this action fail builds that actually fit. GitHub-hosted
    # runners ship node, but self-hosted ones may not, so pin it.
    - uses: actions/setup-node@v4
      with:
        node-version: "20"

    - shell: bash
      run: pip install --quiet mcufit

    - shell: bash
      run: |
        EXACT_FLAG=""
        if [ "${{ inputs.exact }}" = "true" ]; then EXACT_FLAG="--exact"; fi
        mcufit check "${{ inputs.model }}" -b "${{ inputs.board }}" $EXACT_FLAG
